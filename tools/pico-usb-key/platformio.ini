[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = rpipicow
framework = arduino
board_build.core = earlephilhower
; Pin the installed/reviewed Arduino-Pico 5.6.1 revision.
platform_packages =
    framework-arduinopico @ https://github.com/earlephilhower/arduino-pico.git#0643904164d16e2599e5c6e95f0eea5c9d6297d4
monitor_speed = 115200
build_flags =
    -DKEY_DP_PIN=10
    -DKEY_DM_PIN=11
    -DKEY_PULLUP_PIN=12
    -DKEY_BUTTON_PIN=15
    -Wall
    -Wextra
